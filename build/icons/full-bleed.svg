<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Square, edge-to-edge version of icons/icon.svg for icons the OS crops itself
       (Android maskable, Apple touch). The logo is scaled to 80% so it stays inside
       the maskable safe zone. -->
