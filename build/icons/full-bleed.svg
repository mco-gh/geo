    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f08a4b"/>
      <stop offset="1" stop-color="#b13a0a"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" fill="url(#g)"/>
  <g transform="translate(256 256) scale(0.8) translate(-256 -256)">
    <rect x="196" y="112" width="208" height="264" rx="36" fill="#ffffff" fill-opacity="0.35" transform="rotate(8 300 244)"/>
    <rect x="124" y="124" width="208" height="264" rx="36" fill="#1f3b5c"/>
    <circle cx="228" cy="256" r="74" fill="#6f93bd"/>
    <path d="M190 206c22-10 46-6 58 10 10 14-4 26 6 40 12 16 34 8 40 26-10 26-34 44-62 48-6-18-22-24-30-40-8-18 6-30-6-46-6-8-10-22-6-38Z" fill="#eadfc8"/>
    <circle cx="228" cy="256" r="74" fill="none" stroke="#ffffff" stroke-width="10"/>
    <circle cx="246" cy="262" r="14" fill="#ff7a2f" stroke="#fff4e8" stroke-width="5"/>
  </g>
</svg>
